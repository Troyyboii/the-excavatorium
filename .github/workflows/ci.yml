name: Validate application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Test frontend regressions
        run: bun test src

      - name: Check Edge Function
        working-directory: supabase/functions
        run: deno task check

      - name: Test Edge Function guardrails
        working-directory: supabase/functions
        run: deno task test

      - name: Build
        run: bun run build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start local Supabase services
        run: supabase start

      - name: Test database migrations and boundaries
        run: supabase test db supabase/tests/database

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
