name: Deploy Supabase

on:
  workflow_run:
    workflows: ["Validate application"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-supabase-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.SUPABASE_MIGRATION_RECONCILIATION_COMPLETE == 'true'
    runs-on: ubuntu-latest
    env:
      # The repository variable is absent/false until the reviewed history repair is complete.
      SUPABASE_MIGRATION_RECONCILIATION_COMPLETE: ${{ vars.SUPABASE_MIGRATION_RECONCILIATION_COMPLETE }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require migration-history reconciliation gate
        shell: bash
        run: |
          if [[ "$SUPABASE_MIGRATION_RECONCILIATION_COMPLETE" != "true" ]]; then
            echo "::error::Deployment is disabled until the one-time remote migration-history reconciliation is completed and this repository gate is enabled."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Verify deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link the directly managed Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply pending migrations
        run: supabase db push

      - name: Deploy authenticated Edge Functions
        run: |
          supabase functions deploy conversation-extract
          supabase functions deploy document-extract
          supabase functions deploy document-save
          supabase functions deploy custodian-run
